<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JuaGuide — Herramientas y guías para Chile y Argentina</title>
<style>
:root{--bg:#fbfaf7;--card:#fff;--tx:#17202a;--mu:#5b6772;--ac:#0b6e4f;--ac2:#d9381e;--bd:#e4e0d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161b;--card:#18212a;--tx:#eef1f3;--mu:#9aa7b2;--ac:#3fc79a;--ac2:#ff7a5f;--bd:#2a3641;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161b;--card:#18212a;--tx:#eef1f3;--mu:#9aa7b2;--ac:#3fc79a;--ac2:#ff7a5f;--bd:#2a3641;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
.w{max-width:1040px;margin:auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);z-index:5}
header .w{display:flex;align-items:center;gap:18px;height:60px}
.logo{font-weight:800;font-size:1.25rem;text-decoration:none;letter-spacing:-.5px}
.logo b{color:var(--ac)}
nav{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:.92rem}
nav a{text-decoration:none;color:var(--mu)}nav a:hover{color:var(--ac)}
.lang{border:1px solid var(--bd);border-radius:99px;padding:3px;display:flex}
.lang button{border:0;background:none;color:var(--mu);font:600 .78rem inherit;padding:4px 10px;border-radius:99px;cursor:pointer}
.lang button.on{background:var(--ac);color:#fff}
.hero{padding:72px 0 56px}
.kick{color:var(--ac2);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:clamp(2rem,5.5vw,3.4rem);line-height:1.1;margin:.4em 0;letter-spacing:-1px;max-width:15em}
.lead{color:var(--mu);max-width:38em;font-size:1.1rem}
.btn{display:inline-block;background:var(--ac);color:#fff;padding:11px 20px;border-radius:10px;text-decoration:none;font-weight:600;margin:6px 8px 0 0;border:0;cursor:pointer;font-size:1rem}
.btn.o{background:none;color:var(--tx);border:1px solid var(--bd)}
h2{font-size:1.7rem;margin:0 0 6px;letter-spacing:-.5px}
section{padding:40px 0}
.sub{color:var(--mu);margin:0 0 22px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;display:block;text-decoration:none;transition:.15s}
.c:hover{transform:translateY(-2px);border-color:var(--ac)}
.tag{font-size:.72rem;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.08em}
.c h3{margin:6px 0;font-size:1.1rem}.c p{margin:0 0 10px;color:var(--mu);font-size:.93rem}
.c .m{font-size:.85rem;font-weight:600;color:var(--ac)}
.hl{background:linear-gradient(135deg,var(--ac),#07503a);color:#fff;border-radius:18px;padding:32px;margin:20px 0}
.hl h2,.hl p{color:#fff}.hl .btn{background:#fff;color:#07503a}
.art{max-width:720px;padding:48px 0}
.art h1{font-size:2.1rem}.art h3{margin:1.6em 0 .3em}
.note{border-left:4px solid var(--ac2);background:var(--card);padding:12px 16px;border-radius:0 10px 10px 0;color:var(--mu);font-size:.92rem;margin:20px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
form{display:flex;gap:8px;flex-wrap:wrap}
input{padding:11px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);flex:1;min-width:200px;font-size:1rem}
footer{border-top:1px solid var(--bd);padding:28px 0 90px;color:var(--mu);font-size:.88rem}
footer .w{display:flex;flex-wrap:wrap;gap:12px 22px;justify-content:space-between}
footer a{text-decoration:none;margin-right:14px}
#ck{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:320px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:20;font-size:.88rem}
#ck p{margin:0 0 12px}#ck .btn{margin:0 6px 0 0;padding:8px 16px;font-size:.9rem}
@media(max-width:640px){nav .hide{display:none}}
</style>
</head>
