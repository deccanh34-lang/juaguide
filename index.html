.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;display:block;text-decoration:none;transition:.15s}
.c:hover{transform:translateY(-2px);border-color:var(--ac)}
.tag{font-size:.72rem;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.08em}
.c h3{margin:6px 0;font-size:1.1rem}.c p{margin:0 0 10px;color:var(--mu);font-size:.93rem}

.hl h2,.hl p{color:#fff}.hl .btn{background:#fff;color:#07503a}

form{display:flex;gap:8px;flex-wrap:wrap}
input{padding:11px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);flex:1;min-width:200px;font-size:1rem}
